# 发票抬头（购买方）识别配置 - 按税号查表
#
# 税号 = 发票上"购买方/买方"的 统一社会信用代码/纳税人识别号（18位字母数字）
# 用税号识别公司而非中文名：OCR 对字母数字串的准确率远高于中文公司名
#
# 字段说明：
#   tax_id           购买方税号（大小写不敏感，匹配时双方 upper）
#   full_name        公司全称（写入数据库 buyer_company 字段）
#   dir_name         目录简称（用于 invoices/{年}/{公司}/{类型}/ 的"公司"层）
#   default_traveler 该公司发票识别不到真实出行人时用的默认出行人（可选）
#                    例：星辰基石的机票常把"经济舱"等舱位名误识别为出行人，
#                    配此项后，凡非已知人名一律回落到该默认值
#
# 新增公司：在 buyers 下追加一条即可，无需改代码

default: "未分类"

buyers:
  - tax_id: "12100000470095016Q"      # 浙江大学
    full_name: "浙江大学"
    dir_name: "浙大"

  - tax_id: "91330106MAEXL7CP7K"      # 杭州星辰基石半导体有限公司
    full_name: "杭州星辰基石半导体有限公司"
    dir_name: "星辰基石"
    default_traveler: "王春晖"          # 无真实出行人时统一记为王春晖
